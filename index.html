<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>
    <header>
        <div>
            <div class="logo_nav">H</div>
            <span>HelpDesk</span>
        </div>

        <a class="btn_homeborber" href="">&#9776;</a>
    </header>
    <main>
        <h1>Gestion des demandes</h1>
        <p>Suivez et gérez les incidents informatiques.</p>
        <section>
            <h2>Créer une demande</h2>
            <p>Décrivez votre problème informatique.</p>
            <form action="">
                <div class="item1">
                    <label for="">Titre du problème *</label>
                    <input class="input_fram" type="text" placeholder="Connexion Wi-Fi instable">
                </div>
                <div class="item2">
                    <label for="">Catégorie *</label>
                    <select class="input_fram" name="" id="">
                        <option value="">Matériel</option>
                        <option value="">Logiciel</option>
                        <option value="">Réseau</option>
                    </select>
                </div>
                <div class="item3">
                    <label for="">Priorité *</label>
                    <select class="input_fram" name="" id="" >
                        <option value="">Basse</option>
                        <option value="">Normale</option>
                        <option value="">Haute</option>
                    </select>
                </div>
                <div class="item4">
                    <label for="">Description *</label>
                    <input class="input_fram_desc" type="text" placeholder="Décrivez votre problème...">
                </div>
                <button class="item5">＋  Ajouter la demande</button>
            </form>

        </section>
    </main>
    <section class="demandes">
        <div class="title">
            <h2>Liste des demandes</h2>
            <p>3 demandes</p>
        </div>
        <div class="carte">
            <div class="top_carte">
                <p class="cate_side_icon">⌁</p>
                <p class="text_side_icon">HD-001</p>
            </div>
            <h3 class="type_problem">Connexion Wi-Fi instable</h3>
            <p class="problem_desc">Le réseau se déconnecte régulièrement.</p>
            <div class="type_holder">
                <p class="Catégorie ">Réseau</p>
                <p class="Priorité ">Haute</p>
            </div>
            <hr>
            <div class="bottm_carte">
                <a class="modifer_btn" href="">✎ Modifier</a>
                <a class="supprimer_btn" href="">♜ Supprimer</a>
            </div>
        </div>
    </section>

</body>

</html>
